name: Raahi Learning Release Reliability Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: raahi-learning-release-reliability
  cancel-in-progress: false

jobs:
  release-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard DEV synthetic writes
        run: test -f .github/RAAHI_LEARNING_DEV_WRITES_ENABLED

      - name: Guard implementation branch
        run: test "$GITHUB_REF" = "refs/heads/raahi-learning-implementation-v1"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned harness dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm ci --ignore-scripts

      - name: Audit harness dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm audit --audit-level=high

      - name: Install Chromium
        working-directory: tests/raahi-learning-e2e
        run: npx playwright install --with-deps chromium

      - name: Run bounded release reliability smoke
        working-directory: tests/raahi-learning-e2e
        run: node release-reliability-smoke.mjs

      - name: Upload sanitized reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raahi-learning-release-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/raahi-learning-e2e/artifacts-release-reliability/
          if-no-files-found: warn
          retention-days: 30

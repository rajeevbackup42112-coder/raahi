name: Raahi Learning Model Tests

on:
  push:
    branches:
      - raahi-learning-implementation-v1
  pull_request:
    paths:
      - 'tests/model/**'
      - 'tests/release-package.test.mjs'
      - 'scripts/prepare-learning-release.mjs'
      - 'tests/thread-cache.test.mjs'
      - 'apps/raahi-learning/live-thread-deeplink-v13.js'
      - 'docs/raahi-learning/**'

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend-free invariant suite
        run: python tests/model/pre_supabase_model_tests.py

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify production packaging guards
        run: node --test tests/release-package.test.mjs tests/thread-cache.test.mjs

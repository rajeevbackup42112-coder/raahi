name: Raahi Learning Model Tests

on:
  push:
    branches:
      - raahi-learning-implementation-v1
  pull_request:
    paths:
      - 'tests/model/**'
      - 'tests/release-package.test.mjs'
      - 'scripts/prepare-learning-release.mjs'
      - 'tests/thread-cache.test.mjs'
      - 'apps/raahi-learning/live-thread-deeplink-v13.js'
      - 'apps/raahi-learning/delight-v14.js'
      - 'apps/raahi-learning/delight-v14.css'
      - 'tests/delight-v14.test.mjs'
      - 'apps/raahi-learning/market-activation-v14b.js'
      - 'tests/market-activation-v14b.test.mjs'
      - 'apps/raahi-learning/founding-supply-v14c.js'
      - 'tests/founding-supply-v14c.test.mjs'
      - 'tests/scoped-market-activation-v14d.test.mjs'
      - 'apps/raahi-learning/admin-management-v14e.js'
      - 'tests/admin-management-v14e.test.mjs'
      - 'supabase/migrations/**'
      - 'docs/raahi-learning/**'

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend-free invariant suite
        run: python tests/model/pre_supabase_model_tests.py

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned E2E dependencies for load-guard tests
        working-directory: tests/raahi-learning-e2e
        run: npm ci --ignore-scripts

      - name: Verify production packaging and operational guards
        run: node --test tests/release-package.test.mjs tests/thread-cache.test.mjs tests/load-harness.test.mjs tests/ops-guardrails.test.mjs tests/production-canary.test.mjs tests/dev-write-seal.test.mjs tests/pilot-identity-seal.test.mjs tests/launch-polish.test.mjs tests/pilot-cleanup-guards.test.mjs tests/messagecentral-phone-trust.test.mjs tests/controlled-pilot-google-only-trust.test.mjs tests/pilot-messagecentral-seal.test.mjs tests/delight-v14.test.mjs tests/market-activation-v14b.test.mjs tests/founding-supply-v14c.test.mjs tests/scoped-market-activation-v14d.test.mjs tests/admin-management-v14e.test.mjs

      - name: Verify operations script syntax
        run: |
          bash -n scripts/raahi-learning-backup-database.sh scripts/raahi-learning-backup-storage.sh
          node --check tests/raahi-learning-e2e/pilot-delete-harness-auth.mjs
          node --check apps/raahi-learning/launch-polish-v13.js
          node --check apps/raahi-learning/delight-v14.js
          node --check apps/raahi-learning/market-activation-v14b.js
          node --check apps/raahi-learning/founding-supply-v14c.js
          node --check apps/raahi-learning/admin-management-v14e.js

      - name: Verify production-like load target guards
        working-directory: tests/raahi-learning-e2e
        run: node --test production-like-load.test.mjs

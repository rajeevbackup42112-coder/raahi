name: Raahi Learning Model Tests

on:
  push:
    branches:
      - raahi-learning-implementation-v1
  pull_request:
    paths:
      - 'tests/model/**'
      - 'docs/raahi-learning/**'

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend-free invariant suite
        run: python tests/model/pre_supabase_model_tests.py

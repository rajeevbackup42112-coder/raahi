name: Raahi Learning UI Convergence Parent Org

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: raahi-learning-ui-convergence-parent-org
  cancel-in-progress: true

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard DEV synthetic writes
        run: test -f .github/RAAHI_LEARNING_DEV_WRITES_ENABLED

      - name: Guard implementation branch
        run: test "$GITHUB_REF" = "refs/heads/raahi-learning-implementation-v1"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install deterministic harness dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm ci --ignore-scripts
      - name: Audit harness dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: tests/raahi-learning-e2e
        run: npx playwright install --with-deps chromium
      - name: Run parent + organization UI convergence
        working-directory: tests/raahi-learning-e2e
        run: node ui-convergence-parent-org.mjs
      - name: Upload UI convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raahi-learning-ui-convergence-parent-org-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/raahi-learning-e2e/artifacts-ui-convergence-parent-org/
          if-no-files-found: warn
          retention-days: 30

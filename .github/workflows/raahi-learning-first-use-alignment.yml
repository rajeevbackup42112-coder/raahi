name: Raahi Learning First-Use Alignment E2E

on:
  push:
    branches:
      - raahi-learning-implementation-v1
    paths:
      - 'apps/raahi-learning/live-product-fix-v13.js'
      - 'apps/raahi-learning/founding-supply-v14c.js'
      - 'apps/raahi-learning/build-source-v13.mjs'
      - 'supabase/migrations/20260923085000_v14k_first_use_intent_alignment.sql'
      - 'supabase/functions/dev-test-identities/index.ts'
      - 'tests/raahi-learning-e2e/first-use-intent-clean-account.mjs'
      - '.github/workflows/raahi-learning-first-use-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: raahi-learning-first-use-alignment
  cancel-in-progress: true

jobs:
  first-use-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard DEV synthetic writes
        run: test -f .github/RAAHI_LEARNING_DEV_WRITES_ENABLED

      - name: Guard implementation branch
        run: test "$GITHUB_REF" = "refs/heads/raahi-learning-implementation-v1"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deterministic browser dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm ci --ignore-scripts

      - name: Audit browser dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm audit --audit-level=high

      - name: Install Chromium
        working-directory: tests/raahi-learning-e2e
        run: npx playwright install --with-deps chromium

      - name: Reconstruct exact frontend source
        run: node apps/raahi-learning/build-source-v13.mjs

      - name: Start exact local frontend
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/raahi-learning/reconstructed-v13 >/tmp/raahi-first-use-http.log 2>&1 &
          echo $! >/tmp/raahi-first-use-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/build-meta.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/raahi-first-use-http.log || true
          exit 1

      - name: Run clean-account desktop and mobile first-use proof
        working-directory: tests/raahi-learning-e2e
        run: node first-use-intent-clean-account.mjs

      - name: Upload first-use alignment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raahi-learning-first-use-alignment-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/raahi-learning-e2e/artifacts-first-use-alignment/
          if-no-files-found: warn
          retention-days: 30

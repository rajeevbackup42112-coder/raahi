name: Raahi Learning UI Convergence Ads

on:
  push:
    branches:
      - raahi-learning-implementation-v1
    paths:
      - 'apps/raahi-learning/live-product-fix-v13.js'
      - 'tests/raahi-learning-e2e/ui-convergence-ads.mjs'
      - '.github/workflows/raahi-learning-ui-convergence-ads.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: raahi-learning-ui-convergence-ads
  cancel-in-progress: true

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Guard implementation branch
        run: test "$GITHUB_REF" = "refs/heads/raahi-learning-implementation-v1"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install deterministic harness dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm ci --ignore-scripts
      - name: Audit harness dependencies
        working-directory: tests/raahi-learning-e2e
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: tests/raahi-learning-e2e
        run: npx playwright install --with-deps chromium
      - name: Run Raahi Ads UI convergence
        working-directory: tests/raahi-learning-e2e
        run: node ui-convergence-ads.mjs
      - name: Upload Ads UI convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raahi-learning-ui-convergence-ads-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/raahi-learning-e2e/artifacts-ui-convergence-ads/
          if-no-files-found: warn
          retention-days: 30

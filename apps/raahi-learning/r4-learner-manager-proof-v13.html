<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raahi Learning V1.3 R4 Learner Manager Proof</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;background:#f7f8fa;color:#17181a}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}button{padding:10px 14px;cursor:pointer}pre{background:#111;color:#eee;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto}.warn{border:2px solid #b42318;background:#fff0ee;padding:12px;border-radius:10px}</style></head>
<body><h1>Raahi Learning V1.3 — R4 Learner/Manager Proof</h1><div class="warn"><strong>DEV TEST ONLY.</strong> Hard-guarded to Rajeev 1, Rajeev 4 self-access target, Dhanbad and the expected Rajeev 2 teaching option.</div><div class="card"><button id="inspect">Inspect only</button> <button id="run">Run learner + enquiry setup</button></div><div class="card"><h2>Evidence</h2><pre id="log"></pre></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script>(()=>{'use strict';
const URL='https://iiwwmqokaeflaenhlyip.supabase.co',KEY='sb_publishable_bz0YgDXY-WkKxZnogGsfUg_Qgl7E-Wi';
const AUTH='580f39b5-4341-4473-af7d-301b8245263b',ACCOUNT='8c96dbc0-9627-48e2-86a1-3ec72e42e7ec',R4='6a0d9209-339d-42a4-acd9-e13a3dde8b46',LOCATION='028ee066-2130-45d6-8e17-6ceb9b0f1f80',OPTION='6caa9706-7415-4603-8c86-d38eb2b8216b';
const c=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),log=(k,v)=>document.getElementById('log').textContent+=`\n[${new Date().toISOString()}] ${k}\n${typeof v==='string'?v:JSON.stringify(v,null,2)}\n`,rpc=async(n,a={})=>{const{data,error}=await c.rpc(n,a);if(error)throw error;return data};
async function guard(){const{data,error}=await c.auth.getUser();if(error)throw error;const u=data.user;if(!u||u.id!==AUTH)throw new Error(`AUTH_ID_MISMATCH:${u?.id||'none'}`);const ctx=await rpc('get_my_account_context');if(ctx?.account?.account_id!==ACCOUNT)throw new Error('ACCOUNT_ID_MISMATCH');const trust=await rpc('get_my_phone_trust');if(trust?.state!=='fresh')throw new Error(`PHONE_TRUST_NOT_FRESH:${trust?.state||'none'}`);const{data:loc,error:le}=await c.rpc('list_live_locations');if(le)throw le;if(!(loc||[]).some(x=>x.location_id===LOCATION))throw new Error('DHANBAD_NOT_LIVE');log('GUARD PASS',{auth_user_id:u.id,account_id:ACCOUNT,phone_trust:trust});return ctx;}
async function inspect(){try{await guard();log('ACCOUNT CONTEXT',await rpc('get_my_account_context'));}catch(e){log('INSPECT ERROR',e.message)}}
async function run(){try{await guard();const created=await rpc('create_learner',{p_display_name:'R4 Walking Skeleton Learner',p_access_type:'manage',p_avatar_type:'none',p_avatar_ref:null,p_idempotency_key:'r4-chain-create-managed-learner-v1'});log('CREATE MANAGED LEARNER',created);const grant=await rpc('grant_learner_self_access',{p_learner_id:created.learner_id,p_target_account_id:R4,p_idempotency_key:'r4-chain-grant-r4-self-v1'});log('GRANT R4 SELF ACCESS',grant);const selected=await rpc('set_selected_location',{p_location_id:LOCATION,p_idempotency_key:'r4-chain-r1-select-dhanbad-v1'});log('SELECT DHANBAD',selected);const{data:discovery,error:de}=await c.rpc('discover_teaching_options',{p_location_id:LOCATION,p_query:'Mathematics'});if(de)throw de;const found=(discovery||[]).find(x=>x.teaching_option_id===OPTION);if(!found)throw new Error('EXPECTED_OPTION_NOT_DISCOVERED');log('DISCOVERY',found);const enquiry=await rpc('send_enquiry',{p_learner_id:created.learner_id,p_teaching_option_id:OPTION,p_location_id:LOCATION,p_opening_message:'Interested in Mathematics tuition for the R4 walking-skeleton learner.',p_idempotency_key:'r4-chain-send-enquiry-v1'});log('SEND ENQUIRY',enquiry);log('MY ENQUIRIES',await rpc('get_my_enquiries'));log('ACCOUNT CONTEXT AFTER',await rpc('get_my_account_context'));}catch(e){log('R4 LEARNER SETUP ERROR',e.message)}}
document.getElementById('inspect').onclick=inspect;document.getElementById('run').onclick=run;setTimeout(inspect,200);
})();</script></body></html>
